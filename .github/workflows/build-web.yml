name: Build Godot Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Godot project
        run: |
          mkdir -p extracted
          unzip -o DUYNZ_TeaShop_Godot_Complete.zip -d extracted

          PROJECT_DIR=$(dirname "$(find extracted -name project.godot -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Godot project found at:"
          echo "$PROJECT_DIR"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Import project
        run: |
          godot --headless --path "$PROJECT_DIR" --editor --quit

      - name: Build Web
        run: |
          mkdir -p build
          godot --headless \
            --path "$PROJECT_DIR" \
            --export-release "Web" \
            build/index.html

      - name: Upload Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
