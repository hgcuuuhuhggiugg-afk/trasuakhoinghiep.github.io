name: Build Godot Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Godot Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Godot project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find . -name "project.godot" -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Không tìm thấy project.godot"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Đã tìm thấy project:"
          echo "$PROJECT_DIR"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Check Godot
        run: |
          godot --version

      - name: Import Godot project
        run: |
          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit

      - name: Create build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Export Web
        run: |
          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --export-release "Web" \
            "$GITHUB_WORKSPACE/build/index.html"

      - name: Check Web build
        run: |
          if [ ! -f "build/index.html" ]; then
            echo "ERROR: Không tạo được build/index.html"
            exit 1
          fi

          echo "Build Web thành công:"
          ls -lah build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
